[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-analyzer"
version = "0.1.0"
description = "Repo Analyzer Agent — AST-based code chunking and embedding for Autofix"
requires-python = ">=3.9"
dependencies = [
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
]

[project.scripts]
repo-analyzer = "repo_analyzer.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_analyzer"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
