[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autofix-agent"
version = "0.2.0"
description = "AutoFix Agent — Architecture, Incremental Indexing, Localization, Generation and Validation"
requires-python = ">=3.9"
dependencies = [
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "groq>=0.9.0",
]

[project.scripts]
autofix-worker = "autofix_agent.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["autofix_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
